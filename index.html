<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Data 'Splorer</title>
    <!-- Load the Stlite CSS for Streamlit styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css"/>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Load the Stlite Javascript engine -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          // List your app's package dependencies here
          requirements: ["pandas", "numpy", "scipy", "rapidfuzz"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "app.py" // Tells Stlite to look for your app.py file in the same GitHub folder
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
